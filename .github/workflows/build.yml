name: Build and Test Anticheat

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven (skip tests)
      run: mvn clean package -DskipTests -X

    - name: Upload Paper Plugin
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: anticheat-paper-plugin
        path: paper-plugin/target/*.jar
        retention-days: 90

    - name: Upload Velocity Plugin
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: anticheat-velocity-plugin
        path: velocity-plugin/target/*.jar
        retention-days: 90

    - name: Upload Common Library
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: anticheat-common-lib
        path: common/target/*.jar
        retention-days: 90

    - name: Build Status Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Build Summary"
        echo "=========================================="
        echo "Status: Success ✓"
        echo "Artifacts:"
        echo "  - Paper Plugin: paper-plugin/target/anticheat-paper-1.0.0.jar"
        echo "  - Velocity Plugin: velocity-plugin/target/anticheat-velocity-1.0.0.jar"
        echo "  - Common Library: common/target/anticheat-common-1.0.0.jar"
        echo "=========================================="

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          anticheat-paper-plugin/*.jar
          anticheat-velocity-plugin/*.jar
          anticheat-common-lib/*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
