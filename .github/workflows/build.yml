name: Build Anticheat

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run Tests
      run: mvn test

    - name: Upload Paper Plugin Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: anticheat-paper-plugin
        path: paper-plugin/target/anticheat-paper-*.jar
        retention-days: 30

    - name: Upload Velocity Plugin Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: anticheat-velocity-plugin
        path: velocity-plugin/target/anticheat-velocity-*.jar
        retention-days: 30

    - name: Upload Common Library
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: anticheat-common-lib
        path: common/target/anticheat-common-*.jar
        retention-days: 30

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          paper-plugin/target/anticheat-paper-*.jar
          velocity-plugin/target/anticheat-velocity-*.jar
          common/target/anticheat-common-*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Status
      if: always()
      run: |
        echo "Build completed successfully!"
        echo "Paper Plugin: paper-plugin/target/anticheat-paper-1.0.0.jar"
        echo "Velocity Plugin: velocity-plugin/target/anticheat-velocity-1.0.0.jar"
        echo "Common Library: common/target/anticheat-common-1.0.0.jar"
